<head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

<style>
:root{--blue:#1479e8;--green:#18a66a;--red:#ef5350;--bg:#f5f7fb;--card:#fff;--text:#142033;--muted:#738096;--line:#e7ebf2;--orange:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:86px}.top{padding:20px 17px 8px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:800}.sub{font-size:12px;color:var(--muted)}
button{border:0;font:inherit;cursor:pointer}.icon{background:#fff;border:1px solid var(--line);width:42px;height:42px;border-radius:14px}.page{padding:10px 16px}
.balance{background:linear-gradient(135deg,#167eea,#1c9ce8);color:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 28px #1479e833}.balance .label{opacity:.85}.amount{font-size:35px;font-weight:800;margin:7px 0}.approx{opacity:.9}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:13px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px}.metric{font-size:20px;font-weight:800;margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}.orange{color:var(--orange)}
.section{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section h3{margin:0;font-size:18px}.small{font-size:12px;color:var(--muted)}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);height:74px;z-index:10}.nav{max-width:760px;width:100%;margin:auto;display:flex}.nav button{background:none;color:#7b8799;font-size:9px;padding:7px 5px;flex:1}.nav button span{display:block;font-size:21px;margin-bottom:2px}.nav button.active{color:var(--blue)}
.primary,.secondary,.danger{border-radius:14px;padding:13px 16px;font-weight:800;width:100%;margin-top:8px}.primary{background:var(--blue);color:white}.secondary{cursor:pointer;background:#eaf2ff;color:var(--blue)}.danger{background:#fff0ef;color:var(--red)}
.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
.type,.segment{display:flex;background:#eef2f7;padding:4px;border-radius:13px}.type button,.segment button{flex:1;padding:9px;border-radius:10px;background:transparent;color:#637087}.type button.active,.segment button.active{background:#fff;color:var(--blue);font-weight:800}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px 3px;text-align:center;font-size:10px}.cat.active{border:2px solid var(--blue);padding:8px 2px}.cat div{font-size:20px}
.tx{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}.txicon{width:39px;height:39px;border-radius:12px;display:grid;place-items:center;background:#eef5ff;font-size:19px}.txmain{flex:1}.txname{font-weight:700}.txmeta{font-size:10px;color:var(--muted);margin-top:3px}.txamt{font-weight:800;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:30px 8px}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:15px;margin-bottom:10px}
.setting{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:9px}.setting button{width:100%;padding:14px;background:none;text-align:left;display:flex;justify-content:space-between;align-items:center}.badge{display:inline-block;background:#eaf2ff;color:var(--blue);padding:3px 7px;border-radius:8px;font-size:10px;font-weight:800}
.progress{height:9px;background:#e9edf3;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:var(--blue)}.budgetrow{margin:14px 0}.receipt-img{width:100%;max-height:280px;object-fit:contain;border-radius:13px}.itemrow{display:grid;grid-template-columns:1fr 85px 32px;gap:6px;margin:7px 0}.itemrow input{padding:9px;border:1px solid var(--line);border-radius:9px;width:100%}
@media(max-width:430px){.amount{font-size:31px}.catgrid{grid-template-columns:repeat(4,1fr)}}
</style>

<body>
<div class="app">
<header class="top"><div><div class="brand">MyMoney</div><div class="sub">IDR · CNY · Cloud Finance</div></div><button class="icon" onclick="show('settings')">⚙️</button></header>
<main id="content"></main></div>
<nav class="bottom"><div class="nav">
<button id="nav-home" onclick="show('home')"><span>⌂</span>Home</button>

</div></nav>

<script>
const CATS=[["🍜","Food"],["🏠","Housing"],["🚕","Transport"],["📚","Education"],["🛍️","Shopping"],["🏥","Health"],["✈️","Travel"],["💻","Electronics"],["💰","Salary"],["📦","Others"]];
const WALLETS=["Alipay","WeChat Pay","Bank China","Cash CNY","BCA","Mandiri","Cash IDR"];
const FB_CONFIG={
  apiKey:"AIzaSyANXO9o5L-eKdatrGkmrfbjk8nNrcELulM",
  authDomain:"mymoney-id-cny.firebaseapp.com",
  projectId:"mymoney-id-cny",
  storageBucket:"mymoney-id-cny.firebasestorage.app",
  messagingSenderId:"52876726397",
  appId:"1:52876726397:web:2a0fa629ae05c968ece114"
};
let data=JSON.parse(localStorage.getItem("mymoney_v3")||"null")||{rate:2350,display:"CNY",transactions:[],wallets:WALLETS,budgets:{},recurring:[]};
let state={type:"expense",currency:"CNY",cat:"Food",query:""};
let cloud={enabled:false,user:null,unsub:null};

function save(){localStorage.setItem("mymoney_v3",JSON.stringify(data))}
const RECEIPT_DB="mymoney_receipts";
function receiptDB(){return new Promise((res,rej)=>{let r=indexedDB.open(RECEIPT_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("files"))r.result.createObjectStore("files")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function saveReceiptFile(id,file){let db=await receiptDB();return new Promise((res,rej)=>{let tx=db.transaction("files","readwrite");tx.objectStore("files").put(file,id);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>{db.close();rej(tx.error)}})}
async function getReceiptFile(id){let db=await receiptDB();return new Promise((res,rej)=>{let tx=db.transaction("files","readonly");let r=tx.objectStore("files").get(id);r.onsuccess=()=>{db.close();res(r.result||null)};r.onerror=()=>{db.close();rej(r.error)}})}
async function deleteReceiptFile(id){try{let db=await receiptDB();return new Promise((res)=>{let tx=db.transaction("files","readwrite");tx.objectStore("files").delete(id);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>{db.close();res()}})}catch(e){}}
function receiptLabel(x){return x?.receiptName?`🧾 ${esc(x.receiptName)}`:""}
async function attachReceipt(file, targetId="receiptFileAdd", previewId="receiptAddPreview"){if(!file)return; if(file.size>15*1024*1024)return alert("File struk maksimal 15 MB."); let ok=file.type.startsWith("image/")||file.type==="application/pdf"; if(!ok)return alert("Gunakan foto JPG/PNG/HEIC atau file PDF."); window.pendingReceipt={file,name:file.name,type:file.type,size:file.size}; let el=document.getElementById(previewId); if(!el)return; if(file.type.startsWith("image/")){el.innerHTML=`<div class="card"><img class="receipt-img" src="${URL.createObjectURL(file)}"><div class="small" style="margin-top:7px">${esc(file.name)}</div></div>`}else{el.innerHTML=`<div class="card">📄 <b>${esc(file.name)}</b><div class="small">PDF · ${(file.size/1024/1024).toFixed(2)} MB</div></div>`}}
async function openReceipt(id){let f=await getReceiptFile(id);if(!f)return alert("File struk tidak ditemukan di perangkat ini.");let u=URL.createObjectURL(f);window.open(u,"_blank")}
function fmt(v){return new Intl.NumberFormat("id-ID",{maximumFractionDigits:2}).format(v)}
function money(v,c){return (c==="IDR"?"Rp ":"¥ ")+fmt(v)}
function conv(v,from,to){if(from===to)return v;return from==="CNY"?v*data.rate:v/data.rate}
function total(type,currency){return data.transactions.filter(x=>(!type||x.type===type)&&(!currency||x.currency===currency)).reduce((s,x)=>s+Number(x.amount||0),0)}
function balance(currency){return total("income",currency)-total("expense",currency)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function show(p){document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));document.getElementById("nav-"+p)?.classList.add("active");({home,add,scan,budget,history,settings}[p]||home)()}

function home(){
 const cnyBal=balance("CNY"),idBal=balance("IDR"),cnyInc=total("income","CNY"),idInc=total("income","IDR"),cnyExp=total("expense","CNY"),idExp=total("expense","IDR"),recent=[...data.transactions].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
 document.getElementById("content").innerHTML=`<div class="page">
 <div class="balance"><div class="label">Total Balance ${cloud.user?'<span class="badge">☁️ Synced</span>':''}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px"><div><div class="small">🇨🇳 CNY</div><div class="amount" style="font-size:32px">¥ ${fmt(cnyBal)}</div></div><div><div class="small">🇮🇩 IDR</div><div class="amount" style="font-size:32px">Rp ${fmt(idBal)}</div></div></div><div class="small" style="margin-top:10px">CNY dan IDR ditampilkan terpisah — tidak dikonversi.</div></div>
 <div class="grid2"><div class="card"><div class="small green">Income</div><div class="metric green">¥ ${fmt(cnyInc)}</div><div class="small">Rp ${fmt(idInc)}</div></div><div class="card"><div class="small red">Expense</div><div class="metric red">¥ ${fmt(cnyExp)}</div><div class="small">Rp ${fmt(idExp)}</div></div></div>
 <div class="section"><h3>This Month</h3><span class="small">${new Date().toLocaleDateString("en-GB",{month:"long",year:"numeric"})}</span></div>
 <div class="card">${categorySummary()}</div>
 <div class="section"><h3>Recent</h3><button class="small" onclick="show('history')">See all</button></div>
 <div class="card">${recent.length?recent.map(txrow).join(""):'<div class="empty">Belum ada transaksi.</div>'}</div></div>`
}
function categorySummary(){
 let rows=CATS.map(([e,n])=>{let cny=data.transactions.filter(x=>x.type==="expense"&&x.cat===n&&x.currency==="CNY").reduce((s,x)=>s+Number(x.amount||0),0);let idr=data.transactions.filter(x=>x.type==="expense"&&x.cat===n&&x.currency==="IDR").reduce((s,x)=>s+Number(x.amount||0),0);return{e,n,cny,idr}}).filter(x=>x.cny||x.idr);
 if(!rows.length)return '<div class="empty">Belum ada data.</div>';
 return rows.slice(0,8).map(r=>`<div style="display:flex;gap:8px;align-items:center;margin:12px 0"><span>${r.e}</span><div style="flex:1"><div class="small">${r.cny?'¥ '+fmt(r.cny):''}${r.cny&&r.idr?' · ':''}${r.idr?'Rp '+fmt(r.idr):''}</div></div></div>`).join("")
}
function txrow(x){let e=(CATS.find(c=>c[1]===x.cat)||["📦"])[0];return `<div class="tx"><div class="txicon">${e}</div><div class="txmain"><div class="txname">${esc(x.note||x.cat)} ${x.source==="receipt"||x.receiptId?'<span class="badge">🧾</span>':''}</div><div class="txmeta">${esc(x.wallet)} · ${x.cat} · ${x.date}${x.receiptId?` · <button class="small" onclick="openReceipt('${esc(x.receiptId)}')">View receipt</button>`:""}</div></div><div class="txamt ${x.type==="income"?"green":"red"}">${x.type==="income"?"+":"-"} ${money(x.amount,x.currency)}</div></div>`}

function add(){
 document.getElementById("content").innerHTML=`<div class="page"><div class="section"><h3>Add Transaction</h3></div><div class="card">
 <div class="type"><button class="${state.type==="expense"?"active":""}" onclick="state.type='expense';add()">Expense</button><button class="${state.type==="income"?"active":""}" onclick="state.type='income';add()">Income</button></div>
 <div class="field"><label>Amount</label><input id="amount" type="number" step="0.01" placeholder="0.00"></div>
 <div class="field"><label>Currency</label><div class="segment"><button class="${state.currency==="CNY"?"active":""}" onclick="state.currency='CNY';add()">🇨🇳 CNY</button><button class="${state.currency==="IDR"?"active":""}" onclick="state.currency='IDR';add()">🇮🇩 IDR</button></div></div>
 <div class="field"><label>Category</label><div class="catgrid">${CATS.map(([e,n])=>`<button class="cat ${state.cat===n?"active":""}" onclick="state.cat='${n}';add()"><div>${e}</div>${n}</button>`).join("")}</div></div>
 <div class="field"><label>Date</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
 <div class="field"><label>Wallet</label><select id="wallet">${data.wallets.map(w=>`<option>${esc(w)}</option>`).join("")}</select></div>
 <div class="field"><label>Note</label><input id="note" placeholder="e.g. Lunch"></div>
 <div class="field"><label>Receipt / Struk (optional)</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label class="primary" style="display:block;text-align:center;margin:0;cursor:pointer">📷 Take Photo<input id="receiptCameraAdd" type="file" accept="image/*" capture="environment" style="display:none" onchange="attachReceipt(this.files[0],this.id,'receiptAddPreview')"></label><label class="secondary" style="display:block;text-align:center;margin:0;cursor:pointer">🖼️ Photo / PDF<input id="receiptDeviceAdd" type="file" accept="image/*,.pdf,application/pdf" style="display:none" onchange="attachReceipt(this.files[0],this.id,'receiptAddPreview')"></label></div><div id="receiptAddPreview" style="margin-top:10px"></div></div>
 <button class="primary" onclick="saveTx()">Save Transaction</button><button class="secondary" onclick="show('scan')">🧾 Scan Receipt</button></div></div>`
}
async function saveTx(){let amount=Number(document.getElementById("amount").value);if(!amount)return alert("Masukkan nominal.");let tx={id:String(Date.now()),type:state.type,amount,currency:state.currency,rate:data.rate,cat:state.cat,date:document.getElementById("date").value,wallet:document.getElementById("wallet").value,note:document.getElementById("note").value.trim()};if(window.pendingReceipt){tx.receiptId="receipt_"+tx.id;tx.receiptName=window.pendingReceipt.name;tx.receiptType=window.pendingReceipt.type;tx.receiptSize=window.pendingReceipt.size;try{await saveReceiptFile(tx.receiptId,window.pendingReceipt.file)}catch(e){return alert("Gagal menyimpan file struk di perangkat.")}window.pendingReceipt=null}data.transactions.push(tx);save();await cloudSaveTx(tx);show("home")}

function scan(){
 document.getElementById("content").innerHTML=`<div class="page"><div class="section"><h3>Smart Receipt</h3><span class="small">OCR + item detection</span></div><div class="card">
 <div style="text-align:center;font-size:42px">🧾</div><div style="font-weight:800;text-align:center">Foto / upload struk</div><div class="small" style="text-align:center;margin:7px 0 15px">Membaca toko, total, tanggal, currency dan item.</div>
 <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><label class="primary" style="display:block;text-align:center;margin:0;cursor:pointer">📷 Camera<input id="receiptCamera" type="file" accept="image/*" capture="environment" style="display:none" onchange="processReceipt(this.files[0])"></label><label class="secondary" style="display:block;text-align:center;margin:0;cursor:pointer">🖼️ Photo<input id="receiptPhoto" type="file" accept="image/*" style="display:none" onchange="processReceipt(this.files[0])"></label><label class="secondary" style="display:block;text-align:center;margin:0;cursor:pointer">📄 PDF<input id="receiptPDF" type="file" accept="application/pdf,.pdf" style="display:none" onchange="processReceipt(this.files[0])"></label></div>
 <div id="ocrStatus" class="small" style="text-align:center;margin-top:10px"></div><div class="progress"><div id="ocrBar"></div></div></div><div id="receiptPreview"></div><div id="receiptResult"></div></div>`
}
let scanState={raw:"",items:[],parsed:null,image:null};
const ZH_FALLBACK={
  "可口可乐":"Coca-Cola","鸡腿饭":"Chicken leg rice","米饭":"Rice","牛肉":"Beef","猪肉":"Pork","鸡肉":"Chicken","鱼":"Fish","水":"Water","咖啡":"Coffee","茶":"Tea","啤酒":"Beer","饮料":"Beverage","面包":"Bread","面":"Noodles","汉堡":"Burger","薯条":"French fries","火锅":"Hot pot","餐厅":"Restaurant","超市":"Supermarket","洗发水":"Shampoo","沐浴露":"Body wash","牙膏":"Toothpaste","纸巾":"Tissue","卫生纸":"Toilet paper","洗衣液":"Laundry detergent","手机":"Phone","手机壳":"Phone case","充电器":"Charger","耳机":"Earphones","电脑":"Computer","衣服":"Clothing","鞋":"Shoes","药":"Medicine","维生素":"Vitamins","出租车":"Taxi","地铁":"Subway","公交":"Bus","门票":"Ticket","酒店":"Hotel"
};
function classifyItem(name){const q=(name||'').toLowerCase();if(/(food|rice|beef|chicken|pork|fish|water|coffee|tea|drink|cola|bread|noodle|burger|fries|restaurant|hot pot|可乐|米|饭|肉|鱼|水|咖啡|茶|饮料|面|汉堡|餐厅|火锅)/i.test(q))return 'Food';if(/(shampoo|soap|toothpaste|tissue|detergent|body wash|洗发|沐浴|牙膏|纸巾|洗衣)/i.test(q))return 'Shopping';if(/(phone|charger|computer|laptop|earphone|electronics|手机|充电|电脑|耳机)/i.test(q))return 'Electronics';if(/(medicine|vitamin|drug|health|药|维生素)/i.test(q))return 'Health';if(/(taxi|subway|bus|train|transport|出租|地铁|公交)/i.test(q))return 'Transport';if(/(hotel|ticket|flight|travel|酒店|门票)/i.test(q))return 'Travel';if(/(shirt|clothing|shoe|衣服|鞋)/i.test(q))return 'Shopping';return 'Others'}
async function translateZh(text){text=(text||'').trim();if(!text)return '';if(ZH_FALLBACK[text])return ZH_FALLBACK[text];if(!/[\u3400-\u9fff]/.test(text))return text;try{const u='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=zh-CN|en';const r=await fetch(u);const j=await r.json();return j?.responseData?.translatedText||text}catch(e){return text}}
async function enrichItems(items){return Promise.all((items||[]).map(async it=>{const translated=await translateZh(it.name);return {...it,original:it.name,translated,category:classifyItem(translated+' '+it.name)}}))}

async function processReceipt(file){if(!file)return;if(file.size>15*1024*1024)return alert("File struk maksimal 15 MB.");scanState.image=file;scanState.fileName=file.name;scanState.fileType=file.type;let prev=document.getElementById("receiptPreview");if(file.type.startsWith("image/")){prev.innerHTML=`<div class="card" style="margin-top:10px"><img class="receipt-img" src="${URL.createObjectURL(file)}"><div class="small" style="margin-top:7px">${esc(file.name)}</div></div>`}else if(file.type==="application/pdf"){prev.innerHTML=`<div class="card" style="margin-top:10px">📄 <b>${esc(file.name)}</b><div class="small">PDF · ${(file.size/1024/1024).toFixed(2)} MB</div></div>`}else{return alert("Gunakan foto atau PDF.")}let s=document.getElementById("ocrStatus"),b=document.getElementById("ocrBar");if(file.type==="application/pdf"){s.textContent="📄 PDF dipilih — OCR otomatis untuk PDF akan tersedia setelah PDF OCR diaktifkan. Kamu tetap bisa menyimpan file struk.";b.style.width="100%";scanState.raw="";scanState.parsed={store:"Receipt",amount:0,currency:"CNY",date:new Date().toISOString().slice(0,10)};scanState.items=[];renderScan();return}try{let r=await Tesseract.recognize(file,"eng+ind+chi_sim",{logger:m=>{if(m.status==="recognizing text"){let q=Math.round((m.progress||0)*100);s.textContent="OCR "+q+"%";b.style.width=q+"%"}}});scanState.raw=r.data.text;scanState.parsed=parseReceipt(r.data.text);scanState.items=await enrichItems(extractItems(r.data.text,scanState.parsed));s.textContent="✅ Selesai — periksa hasil";b.style.width="100%";renderScan()}catch(e){s.textContent="❌ OCR gagal. File tetap bisa disimpan.";scanState.parsed={store:"Receipt",amount:0,currency:"CNY",date:new Date().toISOString().slice(0,10)};renderScan()}}
function parseReceipt(t){let l=t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),cur=/(CNY|RMB|¥|YUAN|元)/i.test(t)?"CNY":"IDR",cs=[],re=/(?:RP\.?|IDR|RMB|CNY|¥|￥)?\s*([0-9][0-9.,]*)/gi;for(let x of l){let m;while(m=re.exec(x)){let n=norm(m[1],cur);if(n>0&&n<1e9)cs.push({n,line:x})}}let q=cs.filter(x=>/(TOTAL|GRAND|AMOUNT DUE|JUMLAH|BAYAR|PAY|NET)/i.test(x.line));let amount=(q.length?q:cs).sort((a,b)=>b.n-a.n)[0]?.n||0;let date="";for(let x of l){let m=x.match(/\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/);if(m){date=`${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;break}}let store=l.find(x=>x.length>2&&x.length<45&&!/(TOTAL|TEL|PHONE|DATE|TAX|CASH|CHANGE|INVOICE|RECEIPT|CNY|RMB|IDR|RP)/i.test(x))||"Receipt";return{store,amount,currency:cur,date:date||new Date().toISOString().slice(0,10)}}
function norm(s,c){s=s.replace(/\s/g,"");if(c==="IDR")return Number(s.replace(/[^\d]/g,""));if(/^[\d,]+\.\d{1,2}$/.test(s))return Number(s.replace(/,/g,""));if(/^[\d.]+,\d{1,2}$/.test(s))return Number(s.replace(/\./g,"").replace(",", "."));return Number(s.replace(/[^\d]/g,""))}
function extractItems(t,p){let a=[];for(let l of t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean)){if(/(TOTAL|SUBTOTAL|TAX|VAT|CASH|CHANGE|PAYMENT|RECEIPT|INVOICE|TEL|DATE|TIME|RMB|CNY|IDR|RP)/i.test(l))continue;let m=l.match(/^(.*?)(?:\s+|[-:])(?:¥|￥|RMB|Rp\.?|IDR)?\s*([0-9][0-9.,]*)\s*$/i);if(m){let n=m[1].trim(),v=norm(m[2],p.currency);if(n.length>=2&&n.length<55&&v>0)a.push({name:n,amount:v})}}return a.slice(0,30)}
function renderScan(){let x=scanState.parsed||{},a=scanState.items||[];document.getElementById("receiptResult").innerHTML=`<div class="card" style="margin-top:10px"><div class="section" style="margin-top:0"><h3>Review Receipt</h3><span class="small">🇨🇳 Original + 🇬🇧 English + category</span></div>
<div class="field"><label>Store</label><input id="scanStore" value="${esc(x.store)}"></div><div class="field"><label>Total</label><input id="scanAmount" type="number" step="0.01" value="${x.amount}"></div>
<div class="field"><label>Currency</label><select id="scanCurrency"><option ${x.currency==="CNY"?"selected":""}>CNY</option><option ${x.currency==="IDR"?"selected":""}>IDR</option></select></div><div class="field"><label>Date</label><input id="scanDate" type="date" value="${x.date}"></div>
<div class="field"><label>Category</label><select id="scanCat">${CATS.map(c=>`<option>${c[1]}</option>`).join("")}</select></div><div class="field"><label>Wallet</label><select id="scanWallet">${data.wallets.map(w=>`<option>${esc(w)}</option>`).join("")}</select></div>
<div class="section"><h3>Items</h3><span class="small">${a.length} detected</span></div><div id="items">${a.map((it,i)=>`<div class="card" style="margin:8px 0;padding:10px"><div style="display:grid;grid-template-columns:1fr 95px 32px;gap:6px"><input id="in${i}" value="${esc(it.original||it.name)}"><input id="ia${i}" type="number" step="0.01" value="${it.amount}"><button class="danger" style="margin:0;padding:6px" onclick="this.parentElement.parentElement.remove()">×</button></div><div class="small" style="margin-top:6px">🇬🇧 ${esc(it.translated||it.name)} · <b>${esc(it.category||classifyItem(it.name))}</b></div><div style="margin-top:5px"><label class="small">Category</label><select id="ic${i}">${CATS.map(c=>`<option ${c[1]===(it.category||'Others')?'selected':''}>${c[1]}</option>`).join("")}</select></div></div>`).join("")}</div>
<details><summary>OCR text</summary><pre>${esc(scanState.raw)}</pre></details><button class="primary" onclick="saveScan()">💾 Save Receipt + Items</button></div>`}
async function saveScan(){let amount=Number(document.getElementById("scanAmount").value);if(!amount)return alert("Masukkan total.");let items=[];document.querySelectorAll("#items > .card").forEach((r,i)=>{let ins=r.querySelectorAll("input");let cat=r.querySelector("select");if(ins[0]?.value&&Number(ins[1]?.value)>0)items.push({name:ins[0].value,original:scanState.items[i]?.original||ins[0].value,translated:scanState.items[i]?.translated||ins[0].value,category:cat?.value||scanState.items[i]?.category||"Others",amount:Number(ins[1].value)})});let tx={id:String(Date.now()),type:"expense",amount,currency:document.getElementById("scanCurrency").value,rate:data.rate,cat:document.getElementById("scanCat").value,date:document.getElementById("scanDate").value,wallet:document.getElementById("scanWallet").value,note:document.getElementById("scanStore").value||"Receipt",source:"receipt",items};if(scanState.image){tx.receiptId="receipt_"+tx.id;tx.receiptName=scanState.fileName||scanState.image.name;tx.receiptType=scanState.fileType||scanState.image.type;tx.receiptSize=scanState.image.size;try{await saveReceiptFile(tx.receiptId,scanState.image)}catch(e){return alert("Gagal menyimpan file struk di perangkat.")}}data.transactions.push(tx);save();await cloudSaveTx(tx);scanState={raw:"",items:[],parsed:null,image:null};show("home")}

function budget(){
 let c=data.display,month=new Date().toISOString().slice(0,7),b=data.budgets[month]||{};
 let html=`<div class="page"><div class="section"><h3>Monthly Budget</h3><button class="small" onclick="setBudget()">Set budget</button></div>`;
 let rows=CATS.filter(x=>x[1]!=="Salary").map(([e,n])=>{let limit=Number(b[n]||0),spent=data.transactions.filter(x=>x.type==="expense"&&x.cat===n&&x.currency===c&&x.date.startsWith(month)).reduce((s,x)=>s+Number(x.amount||0),0);return{e,n,limit,spent}}).filter(x=>x.limit||x.spent);
 if(!rows.length)html+='<div class="card empty">Belum ada budget. Tekan “Set budget”.</div>';
 rows.forEach(r=>{let pct=r.limit?Math.min(100,r.spent/r.limit*100):0;html+=`<div class="card budgetrow"><div style="display:flex;justify-content:space-between"><b>${r.e} ${r.n}</b><span>${money(r.spent,c)} / ${r.limit?money(r.limit,c):"—"}</span></div><div class="progress" style="margin-top:9px"><div style="width:${pct}%;background:${pct>=100?"#ef5350":"#1479e8"}"></div></div><div class="small" style="margin-top:5px">${r.limit?(pct>=100?"Budget exceeded":"Sisa "+money(Math.max(0,r.limit-r.spent),c)):"No limit"}</div></div>`});
 document.getElementById("content").innerHTML=html+"</div>"
}
function setBudget(){let month=new Date().toISOString().slice(0,7),c=data.display;let cat=prompt("Kategori: "+CATS.filter(x=>x[1]!=="Salary").map(x=>x[1]).join(", "));if(!cat)return;let val=Number(prompt("Budget "+cat+" dalam "+c+":"));if(val>0){data.budgets[month]??={};data.budgets[month][cat]=val;save();budget()}}

function history(){let a=[...data.transactions].sort((x,y)=>y.date.localeCompare(x.date)).filter(x=>(x.note+" "+x.cat+" "+x.wallet).toLowerCase().includes(state.query.toLowerCase()));document.getElementById("content").innerHTML=`<div class="page"><div class="section"><h3>History</h3></div><input class="search" placeholder="🔍 Search" value="${esc(state.query)}" oninput="state.query=this.value;history()"><div class="card">${a.length?a.map(txrow).join(""):'<div class="empty">Tidak ada transaksi.</div>'}</div></div>`}

function settings(){
 document.getElementById("content").innerHTML=`<div class="page"><div class="section"><h3>Settings</h3></div>
 <div class="setting"><button onclick="authAction()"><span>☁️ <b>${cloud.user?esc(cloud.user.email):"Cloud Sync"}</b><br><small>${cloud.user?"Synced across devices":"Login untuk sinkronisasi"}</small></span><b>›</b></button></div>
 <div class="setting"><button onclick="setRate()"><span>💱 Exchange Rate<br><small>1 CNY = Rp ${data.rate.toLocaleString("id-ID")}</small></span><b>›</b></button></div>
 <div class="setting"><button onclick="autoRate()"><span>🔄 Auto Exchange Rate<br><small>Update CNY/IDR sekarang</small></span><b>›</b></button></div>
 <div class="setting"><button onclick="data.display=data.display==='CNY'?'IDR':'CNY';save();settings()"><span>💰 Display Currency<br><small>${data.display} (transaksi tetap dalam mata uang aslinya)</small></span><b>›</b></button></div>
 <div class="setting"><button onclick="addWallet()"><span>👛 Wallets<br><small>${data.wallets.length} wallets</small></span><b>›</b></button></div>
 <div class="setting"><button onclick="backup()"><span>💾 Backup JSON<br><small>Local backup</small></span><b>›</b></button></div>
 <div class="setting"><button onclick="restoreInput()"><span>♻️ Restore JSON</span><b>›</b></button></div>
 <input id="restore" type="file" accept=".json,application/json" style="display:none" onchange="restore(this.files[0])">
 <div class="setting"><button onclick="exportCSV()"><span>📤 Export CSV</span><b>›</b></button></div>
 <div class="setting"><button onclick="if(confirm('Hapus semua transaksi lokal?')){data.transactions=[];save();settings()}"><span style="color:#ef5350">🗑️ Delete local transactions</span><b>›</b></button></div>
 <div class="card"><b>MyMoney v3.0</b><div class="small">Cloud sync, automatic FX, budgets, recurring-ready architecture and receipt OCR.</div></div></div>`
}
async function authAction(){if(cloud.user){if(confirm("Logout dari cloud?")){await FirebaseAPI.signOut(cloud.auth);cloud.user=null;settings()}}else{if(!cloud.enabled)return alert("Cloud belum dikonfigurasi. Lihat FIREBASE_SETUP.md.");try{await FirebaseAPI.signInWithPopup(cloud.auth,new FirebaseAPI.GoogleAuthProvider())}catch(e){alert("Login gagal: "+e.message)}}}
function setRate(){let v=prompt("1 CNY = berapa IDR?",data.rate);if(v&&Number(v)>0){data.rate=Number(v);save();settings()}}
async function autoRate(){try{let r=await fetch("https://api.frankfurter.app/latest?from=CNY&to=IDR");let j=await r.json();if(j.rates?.IDR){data.rate=Number(j.rates.IDR);save();alert("Kurs diperbarui: 1 CNY = Rp "+data.rate.toLocaleString("id-ID"));settings()}else throw Error()}catch(e){alert("Kurs otomatis tidak tersedia. Masukkan kurs manual.")}}
function addWallet(){let v=prompt("Nama wallet baru:");if(v){data.wallets.push(v.trim());save();settings()}}
function backup(){let blob=new Blob([JSON.stringify({version:3,exportedAt:new Date().toISOString(),data},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mymoney-v3-backup.json";a.click()}
function restoreInput(){document.getElementById("restore").click()}
async function restore(f){if(!f)return;try{let j=JSON.parse(await f.text());if(!j.data?.transactions)throw Error();data=j.data;save();show("home")}catch(e){alert("Backup tidak valid.")}}
function exportCSV(){let s="Date,Type,Amount,Currency,Category,Wallet,Note,Rate,Items\n"+data.transactions.map(x=>[x.date,x.type,x.amount,x.currency,x.cat,x.wallet,(x.note||"").replaceAll(","," "),x.rate||data.rate,JSON.stringify(x.items||[]).replaceAll(","," ")].join(",")).join("\n");let b=new Blob([s],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="mymoney-v3.csv";a.click()}

async function initCloud(){
 if(!FB_CONFIG)return;
 try{
  const app=FirebaseAPI.initializeApp(FB_CONFIG),auth=FirebaseAPI.getAuth(app),db=FirebaseAPI.getFirestore(app);cloud={enabled:true,auth,db,user:null,unsub:null};
  FirebaseAPI.onAuthStateChanged(auth,async u=>{cloud.user=u;if(u){await cloudLoad(u.uid)}else if(cloud.unsub){cloud.unsub();cloud.unsub=null}show("home")})
 }catch(e){console.warn("Firebase disabled",e)}
}
async function cloudLoad(uid){
 try{
  const col=FirebaseAPI.collection(cloud.db,"users",uid,"transactions");
  if(cloud.unsub){cloud.unsub();cloud.unsub=null}
  cloud.unsub=FirebaseAPI.onSnapshot(col,snap=>{
   const cloudTx=snap.docs.map(d=>({...d.data(),id:String(d.data().id||d.id),cloud:true})).sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
   const localNonCloud=data.transactions.filter(x=>!x.cloud);
   const ids=new Set(cloudTx.map(x=>String(x.id)));
   data.transactions=[...cloudTx,...localNonCloud.filter(x=>!ids.has(String(x.id)))];
   save();
   home();
  },err=>{
   console.warn("Firestore read failed",err);
   cloud.error=err;
   home();
  });
 }catch(e){
  console.warn("Cloud load failed",e);
  cloud.error=e;
  home();
 }
}
async function cloudSaveTx(tx){if(!cloud.user)return;try{let c={...tx,cloud:true};await FirebaseAPI.setDoc(FirebaseAPI.doc(cloud.db,"users",cloud.user.uid,"transactions",String(tx.id)),c)}catch(e){console.warn("Cloud save failed",e)}}

if(window.FirebaseAPI)initCloud();else window.addEventListener("firebase-ready",initCloud,{once:true});
show("home");
</script>
</body></html>
